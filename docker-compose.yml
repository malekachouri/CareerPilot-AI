# CareerPilot AI — local / single-server stack.
#   cp .env.example .env && docker compose up -d --build
# Web: http://localhost:3000  ·  API docs: http://localhost:8000/api/v1/docs (dev only, bound to 127.0.0.1)
# Later phases add opt-in profiles: ai (Ollama), sandbox, english, observability.

x-api-env: &api-env
  ENV: ${ENV:-dev}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-careerpilot}:${POSTGRES_PASSWORD:-careerpilot}@postgres:5432/${POSTGRES_DB:-careerpilot}
  VALKEY_URL: redis://valkey:6379/0
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CONTENT_DIRS: '["/content"]'
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}

x-content: &content-mount
  - ./content:/content:ro

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot}
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./apps/api
    image: careerpilot-api:local
    # Schema migrations, then the idempotent seed (taxonomy, sources, original questions, curated tests).
    command: ["sh", "-c", "alembic upgrade head && careerpilot seed"]
    environment: *api-env
    volumes: *content-mount
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: careerpilot-api:local
    environment:
      <<: *api-env
      # The API is only reachable from the web container and the host loopback; trust their forwarded headers.
      FORWARDED_ALLOW_IPS: "*"
    volumes: *content-mount
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: careerpilot-api:local
    command: ["celery", "-A", "careerpilot.worker", "worker", "--loglevel=INFO",
              "-Q", "default,ingest,content,llm,media", "--concurrency=2"]
    environment: *api-env
    volumes: *content-mount
    healthcheck:
      test: ["CMD-SHELL", "celery -A careerpilot.worker inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 15s
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: careerpilot-api:local
    command: ["celery", "-A", "careerpilot.worker", "beat", "--loglevel=INFO",
              "--schedule=/tmp/celerybeat-schedule"]
    environment: *api-env
    healthcheck:
      disable: true  # the image's HTTP check is for the API; beat liveness shows as worker:heartbeat
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    image: careerpilot-web:local
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional local LLM for the question generator: docker compose --profile ai up -d
  # then pull the models once: docker compose exec ollama ollama pull qwen3:4b
  #                            docker compose exec ollama ollama pull nomic-embed-text
  # and add embeddings to the knowledge base: POST /api/v1/admin/kb/reindex (admin)
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
  pgdata:
  valkeydata:
